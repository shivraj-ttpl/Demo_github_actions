name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: [self-hosted, demo_github_actions]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses the Node.js already installed on the self-hosted runner (v22 via nvm)
      # instead of actions/setup-node, which downloads through the office firewall.
      - name: Show Node version
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: demo_github_actions-dist
          path: dist
          retention-days: 7
